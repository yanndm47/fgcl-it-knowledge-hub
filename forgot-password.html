<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mot de passe oublié — IT Knowledge Hub</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { background: linear-gradient(135deg, #062851 0%, #0B2647 55%, #14A8B7 140%); min-height: 100vh; }
    .auth-card { background: #fff; border-radius: 14px; box-shadow: 0 20px 60px rgba(6,40,81,0.35); padding: 2.25rem 2rem; }
    .auth-logo { display: flex; justify-content: center; margin-bottom: 0.5rem; }
    .auth-logo img { height: 40px; }
  </style>
</head>
<body>
  <div class="page-narrow">
    <div class="auth-card">
      <div class="auth-logo"><img src="assets/logo.png" alt="FGCL"></div>
      <h3 style="text-align:center;">Réinitialiser votre mot de passe</h3>
      <p class="subtitle" style="text-align:center;">Entrez votre email pour recevoir le lien de réinitialisation.</p>

      <div id="alert-box"></div>

      <form id="forgot-form">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="votre.email@fgcl.com" required>
        <button type="submit" class="btn-primary btn-block">Envoyer le lien</button>
      </form>

      <p style="text-align:center; margin-top:1rem;"><a href="login.html">← Retour à la connexion</a></p>
    </div>
  </div>

  <script src="api.js"></script>
  <script>
    document.getElementById("forgot-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const alertBox = document.getElementById("alert-box");
      const email = document.getElementById("email").value;

      try {
        await apiFetch("/auth/forgot-password", { method: "POST", body: JSON.stringify({ email }) });
        alertBox.innerHTML = `<div class="alert alert-success">
          Si cet email existe, un lien de réinitialisation a été envoyé.
          (Projet académique : sans serveur d'email réel, ce lien s'affiche
          dans la console du serveur backend — regarde la fenêtre CMD qui
          fait tourner uvicorn.)
        </div>`;
        document.getElementById("forgot-form").reset();
      } catch (err) {
        alertBox.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
      }
    });
  </script>
</body>
</html>
