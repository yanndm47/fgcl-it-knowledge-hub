<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mon profil — IT Knowledge Hub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-content">
      <div class="topheader" id="topheader"></div>

      <div class="page" style="max-width: 640px;">
        <h2>Mon profil</h2>

        <div class="tabs">
          <div class="tab active">Informations</div>
          <div class="tab disabled" title="Extension future, hors périmètre actuel">Préférences</div>
          <div class="tab disabled" title="Extension future, hors périmètre actuel">Notifications</div>
        </div>

        <div id="alert-box"></div>

        <form id="profile-form" class="card">
          <div style="display:flex; align-items:center; gap:1rem; margin-bottom:1.5rem;">
            <div class="user-avatar" id="profile-avatar" style="width:56px; height:56px; font-size:20px;"></div>
            <div>
              <div style="font-weight:600;" id="profile-email-display"></div>
              <div class="subtitle" style="margin:0;" id="profile-role-display"></div>
            </div>
          </div>

          <label for="nom_complet">Nom complet</label>
          <input type="text" id="nom_complet" placeholder="Ex : Jean Dupont">

          <label for="email">Email</label>
          <input type="email" id="email" disabled>

          <label for="role">Rôle</label>
          <input type="text" id="role" disabled>

          <label for="site">Site</label>
          <input type="text" id="site" placeholder="Ex : Siège Douala">

          <label for="telephone">Téléphone</label>
          <input type="tel" id="telephone" placeholder="Ex : +237 6 00 00 00 00">

          <button type="submit" class="btn-primary" style="margin-top:1.5rem;">Enregistrer</button>
        </form>
      </div>
    </div>
  </div>

  <script src="api.js"></script>
  <script>
    requireAuth();

    async function init() {
      const me = await fetchCurrentTechnician();
      if (!me) return;
      renderAppShell(me, "profil");

      document.getElementById("profile-avatar").textContent = me.email.slice(0, 2).toUpperCase();
      document.getElementById("profile-email-display").textContent = me.email;
      document.getElementById("profile-role-display").textContent = me.role === "admin" ? "Administrateur" : "Technicien Support";

      document.getElementById("nom_complet").value = me.nom_complet || "";
      document.getElementById("email").value = me.email;
      document.getElementById("role").value = me.role === "admin" ? "Administrateur" : "Technicien Support";
      document.getElementById("site").value = me.site || "";
      document.getElementById("telephone").value = me.telephone || "";
    }

    document.getElementById("profile-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const alertBox = document.getElementById("alert-box");
      alertBox.innerHTML = "";

      const payload = {
        nom_complet: document.getElementById("nom_complet").value || null,
        site: document.getElementById("site").value || null,
        telephone: document.getElementById("telephone").value || null,
      };

      try {
        await apiFetch("/auth/me", { method: "PATCH", body: JSON.stringify(payload) });
        alertBox.innerHTML = `<div class="alert alert-success">Profil mis à jour avec succès.</div>`;
      } catch (err) {
        alertBox.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
      }
    });

    init();
  </script>
</body>
</html>
