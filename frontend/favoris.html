<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Favoris — IT Knowledge Hub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-content">
      <div class="topheader" id="topheader"></div>

      <div class="page">
        <h2>Mes favoris</h2>
        <p class="subtitle">Les incidents que tu as mis de côté pour les retrouver rapidement.</p>

        <div id="favorites-list"></div>
      </div>
    </div>
  </div>

  <script src="api.js"></script>
  <script>
    requireAuth();

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    async function init() {
      const me = await fetchCurrentTechnician();
      if (!me) return;
      renderAppShell(me, "favoris");

      const list = document.getElementById("favorites-list");
      try {
        const favorites = await apiFetch("/incidents/favorites/mine");
        if (favorites.length === 0) {
          list.innerHTML = `<div class="empty-state">
            Aucun favori pour l'instant. Ouvre un incident et clique sur "☆ Ajouter aux favoris" pour le retrouver ici.
          </div>`;
          return;
        }
        list.innerHTML = favorites.map((incident) => `
          <a class="card incident-card" href="incident-detail.html?id=${incident.id}">
            <div class="incident-card-top">
              <div class="incident-title">★ ${escapeHtml(incident.titre)}</div>
              ${statusPill(incident.status)}
            </div>
            <div class="meta-row">
              <span class="ticket-id">#${shortId(incident.id)}</span>
              <span>·</span>
              <span>${formatDate(incident.created_at)}</span>
            </div>
          </a>
        `).join("");
      } catch (err) {
        list.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
      }
    }

    init();
  </script>
</body>
</html>
