<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Incidents — IT Knowledge Hub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-content">
      <div class="topheader" id="topheader"></div>

      <div class="page">
        <h2>Incidents</h2>
        <p class="subtitle">Visibles pour tous les départements — la base de connaissances est partagée.</p>

        <div class="toolbar">
          <select id="filter-status">
            <option value="">Tous les statuts</option>
            <option value="ouvert">Ouverts</option>
            <option value="ferme">Fermés</option>
          </select>
          <select id="filter-department">
            <option value="">Tous les départements</option>
          </select>
          <a href="incident-new.html" class="btn btn-primary" style="margin-left:auto;">+ Déclarer un incident</a>
        </div>

        <div id="incident-list"></div>
      </div>
    </div>
  </div>

  <script src="api.js"></script>
  <script>
    requireAuth();

    const filterStatus = document.getElementById("filter-status");
    const filterDepartment = document.getElementById("filter-department");
    const list = document.getElementById("incident-list");

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    async function loadIncidents() {
      list.innerHTML = `<p class="subtitle">Chargement...</p>`;
      const params = new URLSearchParams();
      if (filterStatus.value) params.append("status", filterStatus.value);
      if (filterDepartment.value) params.append("department_id", filterDepartment.value);

      try {
        const incidents = await apiFetch(`/incidents?${params.toString()}`);
        if (incidents.length === 0) {
          list.innerHTML = `<div class="empty-state">Aucun incident pour ces filtres. Sois le premier à en déclarer un.</div>`;
          return;
        }
        list.innerHTML = incidents.map((incident) => `
          <a class="card incident-card" href="incident-detail.html?id=${incident.id}">
            <div class="incident-card-top">
              <div class="incident-title">${escapeHtml(incident.titre)}</div>
              ${statusPill(incident.status)}
            </div>
            <div class="meta-row">
              <span class="ticket-id">#${shortId(incident.id)}</span>
              <span>·</span>
              <span>${formatDate(incident.created_at)}</span>
            </div>
          </a>
        `).join("");
      } catch (err) {
        list.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
      }
    }

    async function init() {
      const me = await fetchCurrentTechnician();
      if (!me) return;
      renderAppShell(me, "incidents");

      const urlStatus = new URLSearchParams(window.location.search).get("status");
      if (urlStatus) filterStatus.value = urlStatus;

      await populateDepartments(filterDepartment);
      await loadIncidents();
    }

    filterStatus.addEventListener("change", loadIncidents);
    filterDepartment.addEventListener("change", loadIncidents);
    init();
  </script>
</body>
</html>
