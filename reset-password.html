<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nouveau mot de passe — IT Knowledge Hub</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { background: linear-gradient(135deg, #062851 0%, #0B2647 55%, #14A8B7 140%); min-height: 100vh; }
    .auth-card { background: #fff; border-radius: 14px; box-shadow: 0 20px 60px rgba(6,40,81,0.35); padding: 2.25rem 2rem; }
    .auth-logo { display: flex; justify-content: center; margin-bottom: 0.5rem; }
    .auth-logo img { height: 40px; }
  </style>
</head>
<body>
  <div class="page-narrow">
    <div class="auth-card">
      <div class="auth-logo"><img src="assets/logo.png" alt="FGCL"></div>
      <h3 style="text-align:center;">Choisir un nouveau mot de passe</h3>

      <div id="alert-box"></div>

      <form id="reset-form">
        <label for="password">Nouveau mot de passe</label>
        <input type="password" id="password" minlength="8" placeholder="8 caractères minimum" required>
        <button type="submit" class="btn-primary btn-block">Mettre à jour le mot de passe</button>
      </form>

      <p style="text-align:center; margin-top:1rem;"><a href="login.html">← Retour à la connexion</a></p>
    </div>
  </div>

  <script src="api.js"></script>
  <script>
    const token = new URLSearchParams(window.location.search).get("token");
    const alertBox = document.getElementById("alert-box");
    const form = document.getElementById("reset-form");

    if (!token) {
      alertBox.innerHTML = `<div class="alert alert-error">Lien invalide : aucun jeton de réinitialisation trouvé dans l'adresse.</div>`;
      form.style.display = "none";
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const new_password = document.getElementById("password").value;

      try {
        await apiFetch("/auth/reset-password", {
          method: "POST",
          body: JSON.stringify({ token, new_password }),
        });
        alertBox.innerHTML = `<div class="alert alert-success">Mot de passe mis à jour avec succès. Tu peux maintenant te connecter.</div>`;
        form.style.display = "none";
      } catch (err) {
        alertBox.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
      }
    });
  </script>
</body>
</html>
