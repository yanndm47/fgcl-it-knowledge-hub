<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion — IT Knowledge Hub</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background: linear-gradient(135deg, #062851 0%, #0B2647 55%, #14A8B7 140%);
      min-height: 100vh;
    }
    .auth-card {
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 20px 60px rgba(6,40,81,0.35);
      padding: 2.25rem 2rem;
    }
    .auth-logo { display: flex; justify-content: center; margin-bottom: 0.5rem; }
    .auth-logo img { height: 40px; }
    .auth-title { text-align: center; font-weight: 600; color: var(--neutre-700); margin-bottom: 1.5rem; }
    .auth-remember { display: flex; align-items: center; gap: 0.5rem; margin-top: 1rem; font-size: 13px; color: var(--neutre-500); }
    .auth-remember input { width: auto; }
    .auth-forgot { text-align: right; margin-top: 0.4rem; }
    .auth-forgot a { font-size: 12.5px; }
  </style>
</head>
<body>
  <div class="page-narrow">
    <div class="auth-card">
      <div class="auth-logo"><img src="assets/logo.png" alt="FGCL"></div>
      <div class="auth-title">IT Knowledge Hub<br><span style="font-weight:400; color: var(--neutre-500); font-size: 13px;">Connectez-vous à votre espace</span></div>

      <div id="alert-box"></div>

      <form id="login-form">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="votre.email@fgcl.com" required>

        <label for="password">Mot de passe</label>
        <input type="password" id="password" placeholder="••••••••••" required>
        <div class="auth-forgot"><a href="forgot-password.html">Mot de passe oublié ?</a></div>

        <button type="submit" class="btn-primary btn-block">Se connecter</button>

        <label class="auth-remember"><input type="checkbox"> Se souvenir de moi</label>
      </form>
    </div>

    <p style="text-align:center; color: #fff; font-size: 13px; margin-top: 1.25rem;">
      Pas encore de compte ? <a href="register.html" style="color:#fff; text-decoration:underline;">S'inscrire</a>
    </p>
  </div>

  <script src="api.js"></script>
  <script>
    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const alertBox = document.getElementById("alert-box");
      alertBox.innerHTML = "";

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      const body = new URLSearchParams();
      body.append("username", email);
      body.append("password", password);

      try {
        const data = await apiFetch("/auth/login", { method: "POST", body });
        setToken(data.access_token);
        const me = await apiFetch("/auth/me");
        window.location.href = me.role === "admin" ? "admin-dashboard.html" : "dashboard.html";
      } catch (err) {
        alertBox.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
      }
    });
  </script>
</body>
</html>
